<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torpedo de Calabaza</title>
    <link rel="stylesheet" href="/css/styles.css">
        <link
        href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <script src="https://kit.fontawesome.com/0822f36ab0.js" crossorigin="anonymous"></script>
</head>
<body>

    <header>
        <nav class="navbar">
            <div class="logo">TNZO MATES <br> & CROCHET</div>
            <ul class="menu">
                <li><a href="/index.html">Inicio</a></li>
                <li><a href="/productos.html">Productos</a></li>
                <li><a href="/index.html#contacto">Contacto</a></li>
            </ul>
            <div class="iconosNav">
                <input type="search" placeholder="Buscar" class="buscadorNav">
                <span class="icon"><i class="fa-solid fa-user"></i></span>
                <span class="icon"><i class="fa-solid fa-cart-shopping"></i></span>
            </div>
        </nav>
    </header>

    <main class="container main-content">
        
        <div class="product-layout">
            <div class="col-left">
                <div class="main-image">
                    <img src="/assets/bolsoFiesta.jpeg" alt="Mate torpedo ">
                </div>
            </div>

            <div class="col-right">
                <div class="product-headers">
                    <span class="brand">TNZO</span>
                    <h1>Cartera Sobre</h1>
                </div>
                
                <div class="price-box">
                    <p class="price">$30.000</p>
                    <p class="cuotas">3 cuotas sin interés de $10,000</p>
                </div>

                <ul class="specs">
                    <li><strong>Material:</strong> Totora </li>
                </ul>

                <div class="purchase-area">
                    <div class="quantity-row">
                        <span>Cantidad:</span>
                        <div class="quantity-controls">
                            <button>-</button>
                            <input type="text" value="1" readonly>
                            <button>+</button>
                        </div>
                    </div>
                    
                    <button class="btn-add">AGREGAR AL CARRITO</button>
                    <button class="btn-buy">COMPRAR AHORA</button>
                </div>

                <div class="shipping">
                    <p>🚚 Envío gratis a todo el país</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-nav">
            <div class="footer-brand">
                <h2>TNZO MATES</h2>
                <p>& CROCHET</p>
            </div>
            <div class="footer-links">
                <a href="/index.html#contacto">Contacto</a>
                <a href="https://www.instagram.com/tnzo.mates/">Nosotros</a>
            </div>
            <div class="footer-social">
                <a href="https://wa.me/5491165366495"><i class="fa-brands fa-whatsapp"></i></a>
                <a href="https://www.instagram.com/tnzo.mates/"><i class="fa-brands fa-instagram"></i></a>
                <a href="https://www.facebook.com/enzo.nicolas.parise/"><i class="fa-brands fa-facebook"></i></a>
            </div>
        </div>
    </footer>
    
</body>
</html>
